<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="beltBlackGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0EA5E9" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Crest Badge Emblem (100x100 area) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle with light blue & white styling -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#badgeBg)" stroke="#BAE6FD" stroke-width="2.5" />
    
    <!-- Rising Sun Rays -->
    <path d="M 50 14 L 50 24 M 26 26 L 33 33 M 14 50 L 24 50 M 74 26 L 67 33 M 86 50 L 76 50" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    
    <!-- Rising Sun Semi-Circle -->
    <path d="M 28 66 A 22 22 0 0 1 72 66 Z" fill="url(#sunGlow)" />
    
    <!-- Martial Arts Dynamic Kicking Figure -->
    <!-- Head with Headgear silhouette -->
    <circle cx="45" cy="35" r="6" fill="#0284C7" />
    <!-- Torso in Dobok -->
    <path d="M 45 42 L 55 38 L 52 56 L 41 53 Z" fill="#0284C7" />
    <!-- High Roundhouse / Yop Chagi Kicking Leg extending upwards -->
    <path d="M 52 44 L 64 32 L 80 18 L 84 21 L 68 38 L 54 50 Z" fill="url(#skyGrad)" filter="url(#softGlow)" />
    <!-- Foot blade in dynamic extension -->
    <path d="M 80 18 L 88 14 L 90 19 L 84 21 Z" fill="#0369A1" />
    <!-- Ground Plant Leg -->
    <path d="M 43 54 L 37 68 L 41 84 L 35 84 L 30 68 L 39 52 Z" fill="#0369A1" />
    <!-- Guard Fist & Forearm -->
    <path d="M 44 44 L 36 48 L 31 44 L 34 40 L 41 42 Z" fill="#0284C7" />
    <!-- Floating Black Belt Tails with Gold Dan Stripes -->
    <path d="M 46 54 C 38 58 31 66 26 76 C 31 71 39 66 48 60 Z" fill="url(#beltBlackGold)" />
    <path d="M 48 55 C 42 63 39 72 36 80 C 40 73 45 65 50 59 Z" fill="url(#beltBlackGold)" />
    <!-- Dynamic Swoosh / Mat Line -->
    <path d="M 20 86 Q 50 94 80 86" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <!-- Primary Heading: SUNRISE TAEKWONDO -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#0284C7">SUNRISE </tspan>
      <tspan fill="#0EA5E9">TAEKWONDO</tspan>
    </text>

    <!-- Subtitle: MARTIAL ARTS CENTRE -->
    <text x="2" y="62" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="13" fill="#0369A1" letter-spacing="3.5">
      MARTIAL ARTS CENTRE
    </text>

    <!-- Academy Tagline / Discipline -->
    <g transform="translate(2, 78)">
      <rect x="0" y="0" width="8" height="2" rx="1" fill="#38BDF8" />
      <text x="14" y="3" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="0.5">
        World Taekwondo (WT) Curriculum • Attendance &amp; Belt Portal
      </text>
    </g>
  </g>
</svg>
