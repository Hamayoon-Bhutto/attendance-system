# Backup for the Vercel cron in vercel.json: pings the keep-alive endpoint so
# Supabase never sees 7 days without database activity. A failed run means the
# endpoint or Supabase is down, and GitHub emails the repo owner.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keep-alive endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 https://attendance-system-eight-weld.vercel.app/api/keep-alive
